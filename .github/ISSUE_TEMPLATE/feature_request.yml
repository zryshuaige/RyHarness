name: 功能请求
description: 提出一个新产品能力或对现有能力的改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题
      description: 先说处境，再说想要的功能。没有具体场景的「加个 XX」很难排优先级。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 界面草图、命令行、配置项都行；有取舍（会失去什么）也请写出来。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一块
      options:
        - 桌面界面 / 交互
        - 群聊与调度
        - 长期记忆
        - 自我进化（经验手册 / 反馈）
        - 工具与产物
        - 模型供应商 / 路由
        - 打包与分发
        - 内核（packages/*）
        - 文档与工程基建
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过什么 / 现有限制在哪
      description: 有现成配置项、脚本或第三方工具能凑合的话，写出来会省掉一轮往返。
