name: CI

on:
  push:
    # 仓库主线分支是 master，不是 main（GitHub 新仓库默认名会误导人）。
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 只读令牌：CI 不需要写权限，PR 来自 fork 时也不会拿到任何写能力。
permissions:
  contents: read

# 同一分支连续推送只保留最新一次运行，避免旧提交排队拖慢 CI。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # 硬性上限：依赖安装 + 构建 + 测试不应超过 20 分钟，超了就是卡死。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本取自根 package.json 的 packageManager 字段，无需在此重复声明

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # 当前 13 条 high 全部来自 apps/desktop 锁定的 electron 37.10.2（上游公告
        # 修在 41.10.6）与 electron-builder 侧的 extract-zip。升 Electron 是独立的
        # 兼容性决策，不在 CI 里用一次红线把它悄悄放过去：先让报告可见，等升级落地
        # 再删掉 continue-on-error 让它转为硬门禁。
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Lint & format check
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # 根 vitest.config.ts 是唯一 runner：包级 test 脚本并不存在，
        # 在这里写 `pnpm test` 会依赖根脚本转发，等于绕一圈。
        run: npx vitest run

      - name: Coverage
        # 根 vitest.config.ts 刻意不设 thresholds，这一轮只统计不拦截，
        # 因此它永远不会让 CI 变红。单独一轮而不是复用上面的 Test：
        # coverage 需要重新统计执行数据。
        run: npx vitest run --coverage
