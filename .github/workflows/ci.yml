name: CI

on:
  push:
    # 主线分支是 main（建仓时按 GitHub 惯例起的名；早先写的 master 是本地旧名）。
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 夜间跑一遍性能清单：它对机器负载敏感，混在默认通道里只会让「测试全绿」变成噪声，
    # 但完全不跑就会静默腐烂——没人知道它还能不能跑、跑出来的数字有没有塌。
    # UTC 19:17 ≈ 北京时间次日 03:17，刻意避开整点。
    - cron: '17 19 * * *'

# 只读令牌：CI 不需要写权限，PR 来自 fork 时也不会拿到任何写能力。
permissions:
  contents: read

# 同一分支连续推送只保留最新一次运行，避免旧提交排队拖慢 CI。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # 夜间触发只为了跑性能清单（见 perf-nightly）：完整流水线留着也是白烧 Windows
    # runner，而且真出问题时当天就该红，不必等到晚上。
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # 硬性上限：依赖安装 + 构建 + 测试不应超过 30 分钟，超了就是卡死。
    # 2026-11-04 从 20 提到 30：测试改成文件之间串行（见 vitest.config.ts 的
    # fileParallelism），全量从 220 秒变成 440 秒左右，20 分钟的余量不够用了。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本取自根 package.json 的 packageManager 字段，无需在此重复声明

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # 硬门禁：Electron 已升到 44.7.2（清掉 13 条 high：11 条 Electron <41.10.6
        # 与 2 条 extract-zip ≤2.0.1，后者随 electron 改用 @electron-internal/extract-zip
        # 一并消失）。审计现在是硬红线——再引入新的 high/critical 会让 CI 变红。
        # 已知漏洞与缓解措施见 SECURITY.md 与 README「安全」。
        run: pnpm audit --audit-level=high

      - name: Lint & format check
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test & Coverage
        # 根 vitest.config.ts 是唯一 runner：包级 test 脚本并不存在，
        # 在这里写 `pnpm test` 会依赖根脚本转发，等于绕一圈。
        #
        # 覆盖率与测试**跑在同一轮**里，不是两轮：`--coverage` 跑的就是全部测试
        # （coverage 需要重新统计执行数据，所以它自己就是一次全量）。分成两轮会让
        # 这条通道跑两遍全量——本仓的用例会真起浏览器与 Word，两轮下来 20 分钟的
        # 上限不够用（实测单轮 247 秒，CI runner 更慢）。合在一轮后，测试失败与
        # 覆盖率不达标都会让这一步变红，日志里各说各的。
        #
        # 并发度由 vitest.config.ts 的 maxWorkers 定死（2），不跟机器核数走——
        # 真机用例互相踩是这条通道随机红的主因，理由写在那份配置里。
        run: npx vitest run --coverage

      - name: Guardrails (类型逃逸 / 包依赖缺失 / 重复代码 / lint 棘轮 / NOTICE 总账 / 死代码)
        # 硬门禁：scripts/verify-*.mjs 七条自研校验，任何一条非 0 退出即让 CI 变红。
        # 这是「死代码 / 类型逃逸 / 重复代码 / 包依赖缺失 / lint 告警增长 / 许可总账漂移」
        # 七类退化不再靠人眼的保证。
        #
        # 「死代码」那一条（scripts/verify-no-dead-code.mjs）是 2026-11-04 加的：
        # 上一轮把 53 个能力家族都建成了包，其中 12 个在产品里根本触发不到（没有任何
        # import 指向它们），却在对账表里被标成「已有」。这道门禁盯的是「从产品入口
        # 出发不可达的包与文件」，让这种事攒不起来。
        #
        # NOTICE 已在 `pnpm verify` 链内（根 package.json 的 verify 脚本），这里单独再跑
        # 一行是双保险：即使哪天有人把它从 verify 链里摘掉，CI 这一步仍然挡得住
        # 「图标数/随包工作区包数/版本号与仓库事实脱节」——此前这类漂移只能靠人跑一次
        # electron-builder 打包再 ls 安装目录才发现。
        run: |
          pnpm verify
          node scripts/verify-notice.mjs

      - name: Bench
        # 只做趋势留痕，故意非阻塞：本机/CI 无 API key 时 embedding 段会降级为
        # 确定性 stub，benchmark 数字仍可比，但不该因为环境缺 key 拦住合并。
        run: pnpm bench
        continue-on-error: true

  # ---- 夜间：性能清单 ----
  # vitest.perf.config.ts 自己写明「不进默认 CI 通道」，而一个从不运行的脚本会腐烂到
  # 没人发现它已经坏了。所以给它一条夜间通道：continue-on-error 让它永远不挡住任何人，
  # 数字作为 artifact 留下来，让「它退化了」变成一件看得见的事。
  perf-nightly:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    # 失败也不让整条工作流变红：性能用例会因机器负载抖动，红了只会养成忽略红灯的习惯。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        # 性能用例 import 服务端源码，渲染层/主进程走 dist，两边都要先有产物。
        run: pnpm build

      - name: Perf suite
        run: npx vitest run --config vitest.perf.config.ts --reporter=json --outputFile=perf-results.json

      - name: Server baseline
        # 与本机 `pnpm bench` 同一套数字；无 key 时 embedding 段退化为确定性 stub。
        run: pnpm bench

      - name: Upload numbers
        # always()：性能用例挂掉时那半截输出同样是定位问题的线索。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-numbers-${{ github.run_number }}
          path: perf-results.json
          if-no-files-found: warn
          retention-days: 30
