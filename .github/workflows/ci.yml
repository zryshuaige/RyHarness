name: CI

on:
  push:
    # 仓库主线分支是 master，不是 main（GitHub 新仓库默认名会误导人）。
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 只读令牌：CI 不需要写权限，PR 来自 fork 时也不会拿到任何写能力。
permissions:
  contents: read

# 同一分支连续推送只保留最新一次运行，避免旧提交排队拖慢 CI。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # 硬性上限：依赖安装 + 构建 + 测试不应超过 20 分钟，超了就是卡死。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本取自根 package.json 的 packageManager 字段，无需在此重复声明

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # 硬门禁：Electron 已升到 44.7.2（清掉 13 条 high：11 条 Electron <41.10.6
        # 与 2 条 extract-zip ≤2.0.1，后者随 electron 改用 @electron-internal/extract-zip
        # 一并消失）。审计现在是硬红线——再引入新的 high/critical 会让 CI 变红。
        # 已知漏洞与缓解措施见 SECURITY.md 与 README「安全」。
        run: pnpm audit --audit-level=high

      - name: Lint & format check
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # 根 vitest.config.ts 是唯一 runner：包级 test 脚本并不存在，
        # 在这里写 `pnpm test` 会依赖根脚本转发，等于绕一圈。
        run: npx vitest run

      - name: Coverage
        # 根 vitest.config.ts 刻意不设 thresholds，这一轮只统计不拦截，
        # 因此它永远不会让 CI 变红。单独一轮而不是复用上面的 Test：
        # coverage 需要重新统计执行数据。
        run: npx vitest run --coverage
