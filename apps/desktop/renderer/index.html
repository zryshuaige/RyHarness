<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP：script/style 的 unsafe-inline 是必须的——scripts/inline-dist.mjs 把打包后的 JS/CSS
         内联进单个 index.html（file:// 单文件产物），无法改用外部文件或 nonce；网络面已收紧：
         connect-src 只放行本机回环 http/ws（内嵌 server 随机端口），img-src 仅 self+data:。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data:"
    />
    <title>RyAgent</title>
    <style>
      /* 启动 splash：logo 渐入，React 挂载后 500ms 内淡出移除（不拖慢感知启动）。 */
      #splash {
        position: fixed; inset: 0; z-index: 99;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #FAF7F2;
        transition: opacity 320ms ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash svg { width: 96px; height: 96px; animation: splash-in 420ms ease-out; }
      #splash p { margin: 0; color: #B45309; font: 600 15px/1.4 "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 1024 1024"><defs><linearGradient id="sp-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#D97706"/></linearGradient></defs><path fill="url(#sp-bg)" d="M512 32 C742 32 992 172 992 512 C992 852 742 992 512 992 C282 992 32 852 32 512 C32 172 282 32 512 32 Z"/><path fill="#FFFDF8" d="M300 430 L258 218 L438 316 Z M724 430 L766 218 L586 316 Z"/><circle cx="512" cy="560" r="238" fill="#FFFDF8"/><circle cx="432" cy="540" r="26" fill="#3D2E12"/><circle cx="592" cy="540" r="26" fill="#3D2E12"/><path d="M498 620 h28 l-14 22 z" fill="#3D2E12"/><path d="M462 668 q50 42 100 0" stroke="#3D2E12" stroke-width="22" fill="none" stroke-linecap="round"/><path fill="#3D2E12" d="M512 762 L436 716 L436 808 Z M512 762 L588 716 L588 808 Z"/><circle cx="512" cy="762" r="26" fill="#3D2E12"/></svg>
      <p>RyAgent</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
