<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP：script/style 的 unsafe-inline 是必须的——scripts/inline-dist.mjs 把打包后的 JS/CSS
         内联进单个 index.html（file:// 单文件产物），无法改用外部文件或 nonce；网络面已收紧：
         connect-src 只放行本机回环 http/ws（内嵌 server 随机端口），img-src 仅 self+data:。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:* ws://127.0.0.1:*; img-src 'self' data:"
    />
    <title>RyAgent</title>
    <!-- 网页端标签页图标：与 assets/brand 母版同源，gen:icon 导出到 public/（vite 原样拷进
         dist 根目录）。彩色档自带琥珀底板，深浅底都压得住；mono 档是单色猫，只给深色标签栏，
         浅色标签栏上会看不见，因此挂在那条 media 上。路径前缀与 electron/renderer-assets.ts 的
         RENDERER_MOUNT 一致（tests/brand-tiers.test.ts 钉住这条契约）。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/app/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/app/icon-mono.svg" media="(prefers-color-scheme: dark)" />
    <style>
      /* 启动 splash：logo 渐入，React 挂载后 500ms 内淡出移除（不拖慢感知启动）。
         底色跟主题走：系统是暗色却先铺一片 #FAF7F2，那一下奶油色闪屏本身就是一次
         白到黑的刺眼跳变，比多花 100ms 难受得多。取色用局部 token —— styles.css
         这会儿还没加载，抄一份全套主题变量只会多出第二真源。 */
      :root {
        --splash-bg: #FAF7F2;
        --splash-ink: #B45309;
        /* 猫脸底色 / 五官墨色：与应用内 assets/brand/cat.css + styles.css 的 --cat-ink
           同一套口径（暗色下脸底翻深、墨色翻浅，浅墨压在奶油底上只有 1.23:1）。 */
        --splash-cat-face: #FFFDF8;
        --splash-cat-ink: #4A2E1A;
      }
      /* 紧随其后的内联脚本在 body 之前就定了 data-theme；系统暗色这条媒体查询兜的
         是「脚本还没跑 / 跑失败」的窗口期。 */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --splash-bg: #14110E;
          --splash-ink: #FCD34D;
          --splash-cat-face: #241B12;
          --splash-cat-ink: #F0E4D2;
        }
      }
      :root[data-theme='dark'] {
        --splash-bg: #14110E;
        --splash-ink: #FCD34D;
        --splash-cat-face: #241B12;
        --splash-cat-ink: #F0E4D2;
      }
      #splash {
        position: fixed; inset: 0; z-index: 99;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: var(--splash-bg);
        transition: opacity 320ms ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .splash-mark { width: 96px; height: 96px; animation: splash-in 420ms ease-out; }
      /* 母版里的颜色钩子在这里生效：这只猫与应用内那只逐元素同源，只换颜色。
         描边宽度与 fill:none 由母版自带的 style/fill 给出，这里只补应用内那条
         stroke-linecap: round（母版的嘴没有它，gen-icon 导出时手工补上）。 */
      #splash .face { fill: var(--splash-cat-face); }
      #splash .inkf { fill: var(--splash-cat-ink); }
      #splash .ink { stroke: var(--splash-cat-ink); stroke-linecap: round; }
      #splash p { margin: 0; color: var(--splash-ink); font: 600 15px/1.4 "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: scale(1); } }
    </style>
    <script>
      /* 主题在第一帧之前落定：React 挂载前的那一瞬不再闪一次浅色。
         存储键与取值口径必须与 renderer/src/App.tsx 的 loadTheme 一致。 */
      (function () {
        var t = null
        try {
          t = localStorage.getItem('ryagent-theme')
        } catch (e) {
          t = null
        }
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light' ? t : dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <!-- 启动屏这只猫就是 apps/desktop/assets/brand/cat-face.svg 的母版本身（下面
           <g id="ryen-cat-idle"> 一段与母版逐字符相同，tests/brand.test.tsx 比对，
           改母版必须同步这段）。它与应用内 <Cat>、应用图标、任务栏、托盘是同一只猫：
           此处此前内联过一版手写猫——1024 网格另起炉灶、带着领结、墨色也不同，
           等于全应用第二只猫。底板与颜色由上面局部 token 给，形状一律不动。 -->
      <svg class="splash-mark" viewBox="0 0 64 64" fill="none"><defs><linearGradient id="sp-plate" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#D97706"/></linearGradient></defs><path fill="url(#sp-plate)" d="M32 2 C46.375 2 62 10.75 62 32 C62 53.25 46.375 62 32 62 C17.625 62 2 53.25 2 32 C2 10.75 17.625 2 32 2 Z"/>
        <g id="ryen-cat-idle">
          <g transform="translate(32 34) scale(1.05) translate(-32 -34)">
            <circle cx="32" cy="36" r="17" class="face" fill="#FFFDF8"/>
            <path d="M21.5 22.6 L19.6 10.4 L29.1 19.3 Z" class="face" fill="#FFFDF8"/>
            <path d="M42.5 22.6 L44.4 10.4 L34.9 19.3 Z" class="face" fill="#FFFDF8"/>
            <circle class="inkf" cx="26.4" cy="34.8" r="2.7" fill="#4a2e1a"/>
            <circle class="inkf" cx="37.6" cy="34.8" r="2.7" fill="#4a2e1a"/>
            <path class="inkf" d="M29.8 39.4 L32 42.6 L34.2 39.4 Z" fill="#4a2e1a"/>
            <path class="ink" d="M27.5 44.2 q2.25 3.9 4.5 0 q2.25 3.9 4.5 0" fill="none" style="stroke-width:1.9"/>
          </g>
        </g>
      </svg>
      <p>RyAgent</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
